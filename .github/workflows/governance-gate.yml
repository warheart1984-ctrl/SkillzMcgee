name: Governance Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Node unit tests
        run: npm test

      - name: Governance gate (traceability, dependencies, fitness)
        run: make governance-gate
